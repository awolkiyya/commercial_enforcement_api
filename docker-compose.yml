version: "3.9"

services:

  app:
    build:
      context: .
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - ./:/var/www
      - storage:/var/www/storage

    depends_on:
      - mysql
      - redis

    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpassword

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: appuser
      PMA_PASSWORD: apppass

    depends_on:
      - mysql

    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped

    networks:
      - backend

volumes:
  mysql_data:
  storage:

networks:
  backend:
    driver: bridge