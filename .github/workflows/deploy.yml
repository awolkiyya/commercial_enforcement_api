name: Deploy Commercial Enforcement API

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22
          timeout: 30s
          command_timeout: 20m
          script_stop: true

          script: |

            set -Eeuo pipefail

            echo "======================================"
            echo "🚀 Commercial Enforcement API Deployment"
            echo "======================================"

            APP_DIR="/home/tradmin/api/commercial_enforcement_api"

            cd "$APP_DIR"

            echo "📂 Application directory:"
            pwd

            # =====================================================
            # Pull latest code
            # =====================================================

            echo "📥 Pulling latest code..."

            git fetch origin main
            git reset --hard origin/main

            echo "🔍 Current commit:"
            git rev-parse --short HEAD

            # =====================================================
            # Ensure containers are running
            # =====================================================

            echo "🚀 Starting required containers..."

            docker compose up -d --remove-orphans

            echo "⏳ Waiting for containers..."

            sleep 10

            docker compose ps

            # =====================================================
            # Enable maintenance mode
            # =====================================================

            echo "🔒 Enabling maintenance mode..."

            docker compose exec -T app \
              php artisan down \
              --retry=10 \
              --refresh=5 \
              || true

            # =====================================================
            # Build production image
            #
            # Composer dependencies are installed during
            # Docker image build.
            # =====================================================

            echo "🐳 Building production application image..."

            docker compose build --pull app worker scheduler

            # =====================================================
            # Recreate application containers
            # =====================================================

            echo "🚀 Recreating application containers..."

            docker compose up -d --force-recreate --remove-orphans

            echo "⏳ Waiting for application..."

            sleep 10

            echo "📊 Container status..."

            docker compose ps

            # =====================================================
            # PHP / Laravel verification
            # =====================================================

            echo "🐘 Checking PHP..."

            docker compose exec -T app \
              php --version

            echo "🔍 Checking Laravel..."

            docker compose exec -T app \
              php artisan about

            # =====================================================
            # Clear Laravel caches
            # =====================================================

            echo "🧹 Clearing Laravel caches..."

            docker compose exec -T app \
              php artisan optimize:clear

            # =====================================================
            # Database migrations
            # =====================================================

            echo "🗄 Running database migrations..."

            docker compose exec -T app \
              php artisan migrate --force

            # =====================================================
            # Database seeders
            # =====================================================

            echo "🌱 Running database seeders..."

            docker compose exec -T app \
              php artisan db:seed --force

            # =====================================================
            # Laravel runtime directories / permissions
            # =====================================================

            echo "🔐 Fixing Laravel runtime permissions..."

            docker compose exec -T app sh -c '
              mkdir -p \
                storage/logs \
                storage/framework/cache \
                storage/framework/sessions \
                storage/framework/views \
                bootstrap/cache \
                /var/www/.config/psysh

              chown -R www-data:www-data \
                storage \
                bootstrap/cache \
                /var/www/.config

              find storage bootstrap/cache -type d \
                -exec chmod 775 {} \;

              find storage bootstrap/cache -type f \
                -exec chmod 664 {} \;

              chmod -R 775 /var/www/.config
            '

            # =====================================================
            # Storage symlink
            # =====================================================

            echo "🔗 Checking Laravel storage link..."

            docker compose exec -T app sh -c '
              if [ ! -L public/storage ]; then
                php artisan storage:link
              else
                echo "Storage link already exists"
              fi
            '

            # =====================================================
            # Verify routes BEFORE route caching
            # =====================================================

            echo "🔍 Validating Laravel routes..."

            docker compose exec -T app \
              php artisan route:list

            # =====================================================
            # Production configuration cache
            # =====================================================

            echo "⚡ Caching Laravel configuration..."

            docker compose exec -T app \
              php artisan config:cache

            # =====================================================
            # Production route cache
            # =====================================================

            echo "🔍 Caching Laravel routes..."

            docker compose exec -T app \
              php artisan route:cache

            # =====================================================
            # Production view cache
            # =====================================================

            echo "🖼 Caching Laravel views..."

            docker compose exec -T app \
              php artisan view:cache

            # =====================================================
            # Queue workers
            # =====================================================

            echo "🔄 Restarting Laravel queue workers..."

            docker compose exec -T app \
              php artisan queue:restart \
              || true

            # =====================================================
            # Final Laravel validation
            # =====================================================

            echo "🔍 Final Laravel application check..."

            docker compose exec -T app \
              php artisan about

            # =====================================================
            # Disable maintenance mode
            # =====================================================

            echo "🟢 Disabling maintenance mode..."

            docker compose exec -T app \
              php artisan up

            # =====================================================
            # API health check
            # =====================================================

            echo "🏥 Checking API health..."

            sleep 3

            curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1/health

            echo ""

            # =====================================================
            # Docker cleanup
            # =====================================================

            echo "🧹 Cleaning unused Docker images..."

            docker image prune -f

            # =====================================================
            # Final status
            # =====================================================

            echo "📊 Final container status..."

            docker compose ps

            echo "======================================"
            echo "✅ Commercial Enforcement API deployment completed"
            echo "======================================"