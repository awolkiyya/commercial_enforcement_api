name: Deploy Commercial Enforcement API

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          port: 22
          timeout: 30s
          command_timeout: 20m
          script_stop: true

          script: |

            set -Eeuo pipefail

            echo "======================================"
            echo "🚀 Commercial Enforcement API Deployment"
            echo "======================================"

            APP_DIR="/home/tradmin/api/commercial_enforcement_api"

            cd "$APP_DIR"

            echo "📂 Application directory:"
            pwd


            # =====================================================
            # Pull latest code
            # =====================================================

            echo "📥 Pulling latest code..."

            git fetch origin main
            git reset --hard origin/main

            echo "🔍 Current commit:"

            git rev-parse --short HEAD


            # =====================================================
            # Enable maintenance mode if old app exists
            # =====================================================

            echo "🔒 Enabling maintenance mode..."

            docker compose exec -T app \
              php artisan down \
              --retry=10 \
              --refresh=5 \
              2>/dev/null \
              || true


            # =====================================================
            # Stop application containers
            #
            # IMPORTANT:
            # This does NOT remove PostgreSQL data.
            # Docker volumes remain untouched.
            # =====================================================

            echo "🛑 Stopping existing containers..."

            docker compose down --remove-orphans


            # =====================================================
            # Build completely fresh application images
            #
            # --pull = get latest base images
            # --no-cache = do not reuse old Docker build layers
            # =====================================================

            echo "🐳 Building fresh production images..."

            docker compose build \
              --pull \
              --no-cache \
              app \
              worker \
              scheduler


            # =====================================================
            # Start fresh containers
            # =====================================================

            echo "🚀 Starting fresh containers..."

            docker compose up -d --remove-orphans


            # =====================================================
            # Wait for PostgreSQL / application
            # =====================================================

            echo "⏳ Waiting for containers..."

            sleep 10

            echo "📊 Container status..."

            docker compose ps


            # =====================================================
            # Verify application container
            # =====================================================

            echo "🐘 Checking PHP..."

            docker compose exec -T app \
              php --version


            echo "🔍 Checking Laravel..."

            docker compose exec -T app \
              php artisan about


            # =====================================================
            # Clear Laravel caches
            # =====================================================

            echo "🧹 Clearing Laravel caches..."

            docker compose exec -T app \
              php artisan optimize:clear


            # =====================================================
            # Database migrations
            # =====================================================

            echo "🗄 Running database migrations..."

            docker compose exec -T app \
              php artisan migrate --force


            # =====================================================
            # Database seeders
            #
            # IMPORTANT:
            # All production seeders must be idempotent.
            # =====================================================

            echo "🌱 Running database seeders..."

            docker compose exec -T app \
              php artisan db:seed --force


            # =====================================================
            # Laravel runtime directories
            # =====================================================

            echo "🔐 Fixing Laravel runtime permissions..."

            docker compose exec -T app sh -c '

              mkdir -p \
                storage/logs \
                storage/framework/cache \
                storage/framework/sessions \
                storage/framework/views \
                bootstrap/cache \
                /var/www/.config/psysh

              chown -R www-data:www-data \
                storage \
                bootstrap/cache \
                /var/www/.config

              find storage bootstrap/cache \
                -type d \
                -exec chmod 775 {} \;

              find storage bootstrap/cache \
                -type f \
                -exec chmod 664 {} \;

              chmod -R 775 /var/www/.config
            '


            # =====================================================
            # Storage symlink
            # =====================================================

            echo "🔗 Checking Laravel storage link..."

            docker compose exec -T app sh -c '

              if [ ! -L public/storage ]; then

                php artisan storage:link

              else

                echo "Storage link already exists"

              fi
            '


            # =====================================================
            # Validate routes
            #
            # Do this BEFORE route:cache.
            # =====================================================

            echo "🔍 Validating Laravel routes..."

            docker compose exec -T app \
              php artisan route:list


            # =====================================================
            # Cache Laravel configuration
            # =====================================================

            echo "⚡ Caching Laravel configuration..."

            docker compose exec -T app \
              php artisan config:cache


            # =====================================================
            # Cache Laravel routes
            # =====================================================

            echo "🔍 Caching Laravel routes..."

            docker compose exec -T app \
              php artisan route:cache


            # =====================================================
            # Cache Laravel views
            # =====================================================

            echo "🖼 Caching Laravel views..."

            docker compose exec -T app \
              php artisan view:cache


            # =====================================================
            # Restart queue workers
            # =====================================================

            echo "🔄 Restarting Laravel queue workers..."

            docker compose exec -T app \
              php artisan queue:restart \
              || true


            # =====================================================
            # Final application validation
            # =====================================================

            echo "🔍 Final Laravel application check..."

            docker compose exec -T app \
              php artisan about


            # =====================================================
            # Disable maintenance mode
            # =====================================================

            echo "🟢 Disabling maintenance mode..."

            docker compose exec -T app \
              php artisan up


            # =====================================================
            # API health check
            # =====================================================

            echo "🏥 Checking API health..."

            sleep 3

            curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1/health

            echo ""


            # =====================================================
            # Docker cleanup
            # =====================================================

            echo "🧹 Cleaning unused Docker images..."

            docker image prune -f


            # =====================================================
            # Final status
            # =====================================================

            echo "📊 Final container status..."

            docker compose ps

            echo "======================================"
            echo "✅ Commercial Enforcement API deployment completed"
            echo "======================================"